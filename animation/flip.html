<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <style>
        body{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
        }
        .card-container{
            perspective: 1000px;
        }

        /* card */
        .card{
            width: 300px;
            height: 300px; 
            position: relative;
            /* /keep front and back in that 3D world */
            transform-style:preserve-3d;
            transition: transform  0.8s;
            cursor: pointer;

        }

        /* front & back */
        .card-container:hover .card{
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back{
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            /* overflow: hidden; */
            backface-visibility: hidden;
            box-shadow: 0 10px 25px black;
        }
        .card-front img{
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        /* back side */
        .card-back{
            background: linear-gradient(purple,blue);
            color: white;
            transform: rotateY(180deg);
            display:flex ;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-align: center;

        }

      </style>
      </head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTu_UWSEXA3ML5jz_v5m1-f90pqv9e9cue0cZYUj2xsBwsmPQBEnjngTyDV&s=10" alt="profile">
            </div>

            <div class="card-back">
                <h2>Name: Meera</h2>
                <h3>software developer</h3>
            </div>

        </div>

    </div>
</body>
</html>
