<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* class selecters */
        .first{
            color: blue;
        }
        .second{
            color: brown;
        }

        /* id selector */
        #hii{
            color: bisque;
        }
        /* grouping selector */
        h5,p{
            color: aqua;
             background: #bfc4c0;
        }

        /* universal selector */
        *{
            color: yellow;
            background: #1cb030;
        }
    </style>
</head>
<body>
    <!-- class section -->
    <h3 class="first">HELLO</h3>
    <p class="first">hgff</p>
    <h3 class="second">HELLO</h3>
    <h4 id="hii">hii</h4>

    <p>vbnm</p>
    <h5>vbftybvf</h5>
    <h1>fghjk</h1>
</body>
</html>
